services:
  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: recsys-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recsys-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: recsys-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: GORSE_API_URL
        value: http://disabled
      - key: ALLOWED_ORIGINS
        value: https://recsys-iota.vercel.app
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /health

  # ── Redis ────────────────────────────────────────────────────────────────
  - type: redis
    name: recsys-redis
    plan: free
    ipAllowList: []

databases:
  # ── PostgreSQL ───────────────────────────────────────────────────────────
  - name: recsys-db
    databaseName: recsys
    user: recsys_user
    plan: free
