services:
  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: recsys-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recsys-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: recsys-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: GORSE_API_URL
        value: http://disabled   # Gorse not on Render — CF fallback handles this
      - key: ALLOWED_ORIGINS
        value: https://your-app.vercel.app   # CHANGE THIS after Vercel deploy
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /health

  # ── Celery Worker ────────────────────────────────────────────────────────
  - type: worker
    name: recsys-celery-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    dockerCommand: ./worker-start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recsys-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: recsys-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: recsys-backend
          type: web
          envVarKey: SECRET_KEY
      - key: ENVIRONMENT
        value: production
      - key: GORSE_API_URL
        value: http://disabled

  # ── Redis ────────────────────────────────────────────────────────────────
  - type: redis
    name: recsys-redis
    plan: free
    ipAllowList: []   # only allow internal connections

databases:
  # ── PostgreSQL ───────────────────────────────────────────────────────────
  - name: recsys-db
    databaseName: recsys
    user: recsys_user
    plan: free
