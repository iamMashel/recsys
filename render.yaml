services:
  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: recsys-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recsys-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: recsys-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: GORSE_API_URL
        value: http://localhost:8088   # update if Gorse runs separately
      - key: ALLOWED_ORIGINS
        value: https://recsys.vercel.app   # update to your Vercel URL
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /health

  # ── Celery Worker ────────────────────────────────────────────────────────
  - type: worker
    name: recsys-celery-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A workers.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recsys-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: recsys-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: recsys-backend
          type: web
          envVarKey: SECRET_KEY
      - key: ENVIRONMENT
        value: production
      - key: GORSE_API_URL
        value: http://localhost:8088

  # ── Celery Beat ──────────────────────────────────────────────────────────
  - type: worker
    name: recsys-celery-beat
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A workers.celery_app beat --loglevel=info
    envVars:
      - key: REDIS_URL
        fromService:
          name: recsys-redis
          type: redis
          property: connectionString
      - key: ENVIRONMENT
        value: production

databases:
  - name: recsys-db
    databaseName: recsys
    user: recsys_user
    plan: free

  - name: recsys-redis
    type: redis
    plan: free
